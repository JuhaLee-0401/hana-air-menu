<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f1e7"><title>HANA AIR — In-flight Menu</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="gate" id="gate"><div class="gateCard"><div class="logo"><span>✿</span> HANA AIR</div><p>Bridging Asia, Closer Together</p><h1>Choose your language / 言語 / 언어</h1><div class="langs"><button data-lang="en">English<small>ENGLISH</small></button><button data-lang="ja">日本語<small>JAPANESE</small></button><button data-lang="ko">한국어<small>KOREAN</small></button></div></div></div>
<header class="hero" id="hero"><div class="heroIn"><div class="logo"><span>✿</span> HANA AIR</div><div class="tag" data-t="brandSub"></div><h1 data-t="heroTitle"></h1><p data-t="heroSub"></p></div></header>
<div class="top"><div class="topIn"><div class="seat"><label data-t="seatLabel"></label><input id="seat" maxlength="5"></div><button id="langBtn">🌐 EN</button><button id="qrBtn">▦ <span data-t="share"></span></button><button id="cartBtn">🛒 <span data-t="cart"></span><b id="count">0</b></button></div></div>
<main><div class="intro"><strong data-t="browse"></strong><span data-t="seatHint"></span></div>
<section><h2 data-t="carbTitle"></h2><div class="grid" id="carb"></div></section><section><h2 data-t="mainTitle"></h2><div class="grid" id="main"></div></section><section><h2 data-t="sideTitle"></h2><div class="grid" id="side"></div></section><section><h2 data-t="dessertTitle"></h2><div class="grid" id="dessert"></div></section><section><h2 data-t="drinkTitle"></h2><div class="drinks" id="drink"></div></section><section><h2 data-t="specialTitle"></h2><div class="specials" id="special"></div></section></main>
<footer><b>HANA AIR</b> · Concept in-flight ordering experience · Academic project demo</footer>
<div class="shade" id="shade"></div><aside id="drawer"><div class="drawerHead"><h2 data-t="cart"></h2><button id="closeCart">×</button></div><div id="cartItems" class="cartItems"></div><div class="drawerFoot"><div id="seatSummary"></div><button class="primary" id="orderBtn" data-t="placeOrder"></button><button class="clear" id="clearBtn" data-t="clear"></button></div></aside>
<div class="modal" id="detail"><div class="box"><div class="media" id="media"></div><div class="body"><h2 id="mName"></h2><p id="mDesc"></p><div class="actions"><button id="detailClose" data-t="close"></button><button class="primary" id="mAdd" data-t="add"></button></div></div></div></div>
<div class="modal" id="confirm"><div class="box confirm"><div class="ok">✓</div><h2 data-t="orderTitle"></h2><p data-t="orderText"></p><div class="receipt" id="receipt"></div><button class="primary" id="doneBtn" data-t="done"></button></div></div>
<div class="modal" id="qr"><div class="box qrbox"><h2 data-t="shareTitle"></h2><p data-t="shareLive"></p><img id="qrImage" alt="QR"><code id="qrUrl"></code><button id="qrClose" data-t="close"></button></div></div><div class="toast" id="toast"></div>
<script src="config.js"></script><script src="images-a.js"></script><script src="images-b.js"></script><script src="app.js"></script></body></html>
